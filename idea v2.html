<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 300vh;
            background-color: beige;
        }

        .parallax-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 300vh;
            overflow: hidden;
            pointer-events: none;
        }

        .parallax-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .petal {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        #layer1 .petal {
            width: 20px;
            height: 15px;
            opacity: 0.6;
        }

        #layer2 .petal {
            width: 60px;
            height: 20px;
            opacity: 0.8;
        }

        #layer3 .petal {
            width: 100px;
            height: 30px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="parallax-container">
        <div class="parallax-layer" id="layer1"></div>
        <div class="parallax-layer" id="layer2"></div>
        <div class="parallax-layer" id="layer3"></div>
    </div>

    <script>
        const layerConfigs = {
            layer1: { speed: 0.3, count: 50 },
            layer2: { speed: 0.5, count: 50 },
            layer3: { speed: 0.7, count: 50 }
        };

        const petals = {};

        function createPetal(layerId, petalArray) {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight*3;
            const rotation = Math.random() * 360;
            const petalNum = 1 + Math.floor(Math.random() * 4);

            const petal = {
                x: x,
                baseY: y,
                rotation: rotation,
                petalNum: petalNum,
                element: null
            };

            petalArray.push(petal);
            return petal;
        }

        function initializePetals() {
            Object.keys(layerConfigs).forEach(layerId => {
                const layer = document.getElementById(layerId);
                const config = layerConfigs[layerId];
                petals[layerId] = [];

                for (let i = 0; i < config.count; i++) {
                    const petal = createPetal(layerId, petals[layerId]);
                    const petalEl = document.createElement('div');
                    petalEl.className = 'petal';
                    petalEl.style.left = petal.x + 'px';
                    petalEl.style.top = petal.baseY + 'px';
                    petalEl.style.rotate = petal.rotation + 'deg';
                    petalEl.style.backgroundImage = `url('images/petal${petal.petalNum}.png')`;
                    // petalEl.style.opacity = (100 - (petal.petalNum-1)*30) +"%";
                    petal.element = petalEl;
                    layer.appendChild(petalEl);
                }
            });
        }

        function updateParallax() {
            const scrollY = window.scrollY;

            Object.keys(layerConfigs).forEach(layerId => {
                const config = layerConfigs[layerId];
                const offset = scrollY * config.speed;

                petals[layerId].forEach(petal => {
                    const newY = petal.baseY - offset;

                    petal.element.style.top = (petal.baseY - offset) + 'px';
                    petal.rotation = offset*config.speed;
                    petal.element.style.rotate = petal.rotation + 'deg';
                });
            });

            requestAnimationFrame(updateParallax);
        }

        initializePetals();
        updateParallax();
    </script>
</body>
</html>
